ksp = "2.3.12"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
media3 = "1.6.1"
ffmpegDecoder = "1.6.1+2"
room = "2.8.4"
datastore = "1.1.1"
coroutines = "1.9.0"
serialization = "1.9.0"
okhttp = "4.12.0"
coil = "2.7.0"
documentfile = "1.0.1"
